services:
  acompanhamento:
    build:
      context: .
      target: dev

    ports:
      - "3001:3001"

    environment:
      VITE_PARENT_ORIGINS: ${VITE_PARENT_ORIGINS:-http://localhost:5173}

    volumes:
      - .:/app
      - acompanhamento_node_modules:/app/node_modules

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "3001"

volumes:
  acompanhamento_node_modules:
