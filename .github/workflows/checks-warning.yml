name: Acompanhamento Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate acompanhamento
    runs-on: ubuntu-latest

    env:
      VITE_PARENT_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Validate production image
        id: docker
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile ainda nao criado."
            exit 1
          fi

          docker build \
            -t frota-acompanhamento:ci \
            .

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Acompanhamento checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          result() {
            if [ "$2" = "success" ]; then
              echo "| $1 | PASSED |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | WARNING: $2 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$1: $2"
            fi
          }

          result "Node.js" "${{ steps.node.outcome }}"
          result "Dependencies" "${{ steps.install.outcome }}"
          result "Build" "${{ steps.build.outcome }}"
          result "Tests" "${{ steps.tests.outcome }}"
          result "Docker image" "${{ steps.docker.outcome }}"
